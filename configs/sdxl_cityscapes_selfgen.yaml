# sdxl_cityscapes.yaml with CA measured the paper's way (2026-11-07).
#
# CA-LoRA Sec. 3.2 measures CA on images the base model generated from c
# ("x0 = Phi_T2I(c; theta)"), not on training images. Every selection of the
# earlier runs (runs/sdxl_cityscapes, runs/sdxl_c1 and their fewshot10 copies) was
# measured on the first 256 Cityscapes train frames, so all of them -- and every
# expert and router built on them -- are redone under this name.
#
# This project does not measure on its own: the measurement is made once in
# Optimizing-CA-LoRA (configs/ca_selfgen.yaml -> runs/ca_selfgen/measurements, the
# 20 t below) and imported:
#   bash scripts/ops/import_measurements.sh \
#       /workspace/Optimizing-CA-LoRA/runs/ca_selfgen/measurements sdxl_cityscapes_selfgen
# after which `catsm.cli select` refuses anything but data_source=selfgen, and
# `foster` refuses a selection that does not carry it. The measure.* block below
# only documents what the imported files are (the timesteps the diagnosis and
# aggregate mode see); it is not used to measure.
#
# The interval representatives (interval_select.representative) are inherited
# unchanged from the real-image decision of 2026-09-14 -- user decision 2026-11-07:
# run the pipeline on the self-generated measurement with the existing
# representatives, no re-decision (scripts/ops/run_selfgen_chain.sh). They were a
# visual judgement on the old measurements; scripts/diagnose_ca.py on the new set
# shows whether they still sit where the old figures put them.
_base_: sdxl_cityscapes.yaml

name: sdxl_cityscapes_selfgen

measure:
  timesteps: [1, 41, 61, 81, 121, 125, 201, 250, 301, 375, 401, 481, 500, 601, 701, 750,
              801, 901, 981, 999]
  source: selfgen
